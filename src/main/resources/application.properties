spring.application.name=alumni-searcher
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Creates or updates the "alumni" table automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# PhantomBuster settings. Without the API key and agent id the application still starts,
# and searches reply with a clear "PhantomBuster is not configured" error.
phantombuster.base-url=https://api.phantombuster.com/api/v2
phantombuster.api-key=${PHANTOMBUSTER_API_KEY:}
phantombuster.agent-id=${PHANTOMBUSTER_AGENT_ID:}
phantombuster.profiles-per-search=${PHANTOMBUSTER_PROFILES_PER_SEARCH:25}
# Names of the phantom settings that receive the search text and the profile count.
# Change these only if your phantom uses different setting names.
phantombuster.search-argument=${PHANTOMBUSTER_SEARCH_ARGUMENT:linkedInSearchUrl}
phantombuster.profile-count-argument=${PHANTOMBUSTER_PROFILE_COUNT_ARGUMENT:numberOfResultsPerSearch}
# The search waits up to poll-interval x max-poll-attempts (5s x 36 = 3 minutes).
phantombuster.poll-interval=${PHANTOMBUSTER_POLL_INTERVAL:5s}
phantombuster.max-poll-attempts=${PHANTOMBUSTER_MAX_POLL_ATTEMPTS:36}
